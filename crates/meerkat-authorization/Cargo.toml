[package]
name = "meerkat-authorization"
description = "Process-local generated grant authority for Meerkat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # needs meerkat and meerkat-runtime, which depend on this crate
    "tests/native_cost.rs",
    # support modules of tests/native_cost.rs
    "tests/native_cost",
    # needs meerkat and meerkat-runtime, which depend on this crate
    "tests/native_governed_loop.rs",
    # support modules of tests/native_governed_loop.rs
    "tests/native_governed_loop",
]

[features]
integration-real-tests = []
# Internal, not for consumers: compiles the unit tests that need the
# workspace (a crate this one cannot depend on once published). Only the
# path-only self dev-dependency enables it, and `cargo package` strips that
# dev-dependency, so the published package compiles those tests out
# (ci/standalone-workspace-only.toml names them).
workspace-tests = []

[dependencies]
indexmap.workspace = true
meerkat-core.workspace = true
meerkat-machine-schema.workspace = true
meerkat-machine-dsl.workspace = true
meerkat-authorization-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# Enables `workspace-tests` for this crate's own tests; path-only, so the
# published package does not carry it. It adds nothing else: with default
# features on, every test build would turn them back on, and a
# `--no-default-features` test build would not check the feature set it
# names.
meerkat-authorization = { path = ".", default-features = false, features = ["workspace-tests"] }
axum.workspace = true
meerkat-core = { workspace = true, features = ["test-support"] }
meerkat-anthropic = { workspace = true, default-features = false }
meerkat-auth-core.workspace = true
meerkat-models.workspace = true
async-trait.workspace = true
futures.workspace = true
meerkat = { path = "../meerkat", default-features = false, features = ["anthropic", "session-store", "memory-store", "local-authorization", "mcp"] }
meerkat-mcp.workspace = true
meerkat-llm-core.workspace = true
meerkat-runtime = { path = "../meerkat-runtime", features = ["local-authorization", "test-support"] }
meerkat-tools = { workspace = true, default-features = false }
tempfile.workspace = true
# Paused virtual time for owner-deadline tests; production features unchanged.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
