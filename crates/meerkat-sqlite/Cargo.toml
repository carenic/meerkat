[package]
name = "meerkat-sqlite"
description = "Shared SQLite mechanics for Meerkat stores: connection profiles, migration ledger, JSON column codec, maintenance fence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Test hooks for dependent crates' own tests (never a production feature):
# the schema preflight probe that commits a concurrent schema change between
# the preflight's ledger read and the reads that follow it.
test-support = []

[dependencies]
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
