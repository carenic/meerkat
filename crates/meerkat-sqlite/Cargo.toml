[package]
name = "meerkat-sqlite"
description = "Shared SQLite mechanics for Meerkat stores: connection profiles, migration ledger, JSON column codec, maintenance fence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# These tests check the repository's build configuration (`.cargo/config.toml`
# and `MODULE.bazel` set the bundled SQLite's flags) and the host binaries'
# sources, so they run in the repository only and stay out of the published
# package, whose other tests build standalone.
exclude = [
    "tests/lock_profile.rs",
    "tests/lock_profile_sources.rs",
    "tests/process_wide_mutexes.rs",
    "tests/statistics_switch_first.rs",
    "tests/statistics_switch_late.rs",
]

[features]
# Test hooks for dependent crates' own tests (never a production feature):
# the schema preflight probe that commits a concurrent schema change between
# the preflight's ledger read and the reads that follow it.
# `watch::test_support`: hold the notification registration of change
# watches in one directory, for tests of code that starts them.
test-support = []

[dependencies]
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
