[package]
name = "meerkat-machine-schema"
description = "Formal machine schemas and transition definitions for Meerkat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # pins the repository's docs/reference tables against the registry
    "tests/docs_machine_authority_alignment.rs",
]

[dependencies]
indexmap = { version = "2", default-features = false, features = ["std"] }
meerkat-core = { workspace = true }
meerkat-authorization-contracts = { workspace = true }
meerkat-machine-dsl.workspace = true
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
