[package]
name = "meerkat-mcp-server"
description = "MCP server exposing Meerkat as a tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
# Workspace-only test files: `cargo package` leaves them out and the
# workspace still runs them. ci/standalone-workspace-only.toml lists the same
# files with the same reasons; the PR guard fails when the two disagree.
exclude = [
    # includes the repository's tests/fixtures/live_smoke/support.rs (live lane)
    "tests/live_mcp_matrix.rs",
]

[[bin]]
name = "rkat-mcp"
path = "src/main.rs"

[[test]]
name = "live_mcp_matrix"
path = "tests/live_mcp_matrix.rs"

[dependencies]
meerkat = { workspace = true, features = ["anthropic", "openai", "openai-realtime", "gemini", "copilot", "jsonl-store", "session-store", "memory-store", "memory-store-session", "skills", "schedule", "workgraph"] }
meerkat-mcp = { workspace = true }
meerkat-core = { workspace = true }
meerkat-models = { workspace = true }
meerkat-contracts = { workspace = true, features = ["schema"] }
meerkat-client = { workspace = true }
meerkat-store = { workspace = true }
meerkat-mob = { workspace = true, optional = true }
meerkat-mob-mcp = { workspace = true, optional = true }
meerkat-tools = { workspace = true }
meerkat-comms = { workspace = true, optional = true }
meerkat-runtime = { workspace = true }
async-trait = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
schemars = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true, features = ["derive"] }
uuid = { workspace = true }
chrono = { workspace = true }

[features]
default = ["comms", "mob", "schedule", "workgraph"]
comms = ["meerkat/comms", "dep:meerkat-comms"]
mob = ["dep:meerkat-mob", "dep:meerkat-mob-mcp"]
schedule = ["meerkat/schedule"]
workgraph = ["meerkat/workgraph"]

[package.metadata.cargo-machete]
ignored = ["dirs", "meerkat-client", "meerkat-comms", "meerkat-mcp", "meerkat-mob", "meerkat-mob-mcp", "meerkat-runtime", "rmcp"]  # feature-gated / optional

[dev-dependencies]
# The hook run-override fixture (meerkat_core::config::HOOK_RUN_OVERRIDES_FIXTURE_JSON).
meerkat-core = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
meerkat-mob = { workspace = true, features = ["test-support"] }
meerkat-runtime = { workspace = true, features = ["test-support"] }
meerkat-session = { workspace = true, features = ["session-store"] }

[lints]
workspace = true
