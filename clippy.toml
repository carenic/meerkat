# Clippy configuration for the whole workspace.

# Every API that starts a process. Shipped code starts one only at the launch
# sites `crates/meerkat/tests/host_launch_sites.rs` lists (`SITES`): the OS
# confinement backend, a confined launch kind's trusted-host branch, and the
# one command every host launch exemption's fixed-program constructor builds
# (`meerkat_core::HostLaunchExemption`), each expression under its own
# `#[allow(clippy::disallowed_methods)]`, which that test counts. Every other
# start goes through a launch kind's confinement or an exemption's
# constructor. Test code, the developer tooling crate and examples allow the
# lint for themselves. `allow-invalid` keeps an entry for a crate or platform
# a package does not build with from failing that package's lint.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "a process launch: route it through the launch kind's confinement or a HostLaunchExemption constructor, and list a new launch site in crates/meerkat/tests/host_launch_sites.rs" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "replaces the process with another program: a process launch", allow-invalid = true },
    { path = "tokio::process::Command::new", reason = "a process launch: route it through the launch kind's confinement, and list a new launch site in crates/meerkat/tests/host_launch_sites.rs", allow-invalid = true },
    { path = "libc::fork", reason = "a process launch (the confinement backend's own)", allow-invalid = true },
    { path = "libc::vfork", reason = "a process launch", allow-invalid = true },
    { path = "libc::clone", reason = "a process launch", allow-invalid = true },
    { path = "libc::posix_spawn", reason = "a process launch (the confinement backend's own)", allow-invalid = true },
    { path = "libc::posix_spawnp", reason = "a process launch", allow-invalid = true },
    { path = "libc::execv", reason = "a process launch", allow-invalid = true },
    { path = "libc::execve", reason = "a process launch", allow-invalid = true },
    { path = "libc::execvp", reason = "a process launch", allow-invalid = true },
    { path = "libc::execvpe", reason = "a process launch", allow-invalid = true },
    { path = "libc::execl", reason = "a process launch", allow-invalid = true },
    { path = "libc::execle", reason = "a process launch", allow-invalid = true },
    { path = "libc::execlp", reason = "a process launch", allow-invalid = true },
    { path = "libc::fexecve", reason = "a process launch", allow-invalid = true },
    { path = "libc::system", reason = "a process launch through a shell", allow-invalid = true },
    { path = "libc::popen", reason = "a process launch through a shell", allow-invalid = true },
    { path = "nix::unistd::fork", reason = "a process launch", allow-invalid = true },
    { path = "nix::unistd::execv", reason = "a process launch", allow-invalid = true },
    { path = "nix::unistd::execve", reason = "a process launch", allow-invalid = true },
    { path = "nix::unistd::execvp", reason = "a process launch", allow-invalid = true },
    { path = "nix::unistd::execvpe", reason = "a process launch", allow-invalid = true },
    { path = "nix::unistd::fexecve", reason = "a process launch", allow-invalid = true },
    { path = "nix::unistd::execveat", reason = "a process launch", allow-invalid = true },
    { path = "webbrowser::open", reason = "launches a browser from the host's PATH: use the HostLaunchExemption::browser_opener constructor", allow-invalid = true },
    { path = "webbrowser::open_browser", reason = "launches a browser from the host's PATH: use the HostLaunchExemption::browser_opener constructor", allow-invalid = true },
    { path = "webbrowser::open_browser_with_options", reason = "launches a browser from the host's PATH: use the HostLaunchExemption::browser_opener constructor", allow-invalid = true },
]
