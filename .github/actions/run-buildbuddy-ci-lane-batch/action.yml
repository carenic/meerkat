name: Run BuildBuddy CI lane batch
description: Run a small batch of BuildBuddy CI lanes from one GitHub runner.

inputs:
  lanes:
    description: Newline-separated BuildBuddy CI lane names.
    required: true
  group:
    description: Short group name used for log artifact naming.
    required: true
  profile:
    description: "Setup profile: submitter, full, native, or doctor."
    required: true
  mode:
    description: BuildBuddy CI mode.
    required: false
    default: full-fresh
  batch_jobs:
    description: Maximum number of local lane submitters to run in parallel.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup BuildBuddy CI
      uses: ./.github/actions/setup-buildbuddy-ci
      with:
        profile: ${{ inputs.profile }}

    # The self-hosted control plane has no public ingress: submitters reach
    # its gRPCS port through an IAP tunnel on 127.0.0.1 and trust only its
    # per-boot CA (BUILDBUDDY_TLS_CA_B64 from control-plane-up).
    - name: Authenticate to GCP for the control-plane tunnel
      if: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-buildbuddy' && env.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.MEERKAT_GCP_SERVICE_ACCOUNT != '' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ env.MEERKAT_GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.MEERKAT_GCP_SERVICE_ACCOUNT }}
        project_id: ${{ env.MEERKAT_GCP_PROJECT_ID }}

    - name: Setup gcloud for the control-plane tunnel
      if: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-buildbuddy' }}
      uses: google-github-actions/setup-gcloud@v3

    - name: Authenticate to GCP with JSON fallback
      if: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-buildbuddy' }}
      shell: bash
      run: |
        if gcloud auth list --filter=status:ACTIVE --format='value(account)' | grep -q .; then
          exit 0
        fi
        if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]]; then
          echo "GCP auth is required to reach the self-hosted BuildBuddy control plane." >&2
          exit 1
        fi
        key_file="${RUNNER_TEMP}/gcp-key.json"
        printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > "${key_file}"
        gcloud auth activate-service-account --key-file "${key_file}"
        rm -f "${key_file}"

    - name: Open the IAP tunnel to the control plane
      if: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-buildbuddy' }}
      shell: bash
      run: scripts/gcp-buildbuddy-control-plane tunnel

    - name: Run BuildBuddy lane batch
      shell: bash
      env:
        LANES: ${{ inputs.lanes }}
        MEERKAT_BUILDBUDDY_CI_MODE: ${{ inputs.mode }}
        MEERKAT_BUILDBUDDY_LOG_ROOT: ${{ runner.temp }}/buildbuddy-logs
        MEERKAT_BUILDBUDDY_BATCH_JOBS: ${{ inputs.batch_jobs || env.MEERKAT_BUILDBUDDY_BATCH_JOBS }}
        MEERKAT_BUILDBUDDY_OUTPUT_ROOT: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-local' && '/home/gha/.cache/meerkat/gcp-bazel-output-roots' || '' }}
        MEERKAT_BUILDBUDDY_REPOSITORY_CACHE: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-local' && '/home/gha/.cache/meerkat/gcp-bazel-repository-cache' || format('{0}/buildbuddy-repository-cache', runner.temp) }}
        MEERKAT_BAZEL_DISK_CACHE: ${{ env.MEERKAT_BAZEL_BACKEND == 'gcp-local' && '/home/gha/.cache/meerkat/gcp-bazel-disk-cache' || '' }}
      run: |
        mkdir -p "${MEERKAT_BUILDBUDDY_LOG_ROOT}"
        mkdir -p "${MEERKAT_BUILDBUDDY_REPOSITORY_CACHE}"
        if [[ -n "${MEERKAT_BUILDBUDDY_OUTPUT_ROOT}" ]]; then
          mkdir -p "${MEERKAT_BUILDBUDDY_OUTPUT_ROOT}"
        fi
        if [[ -n "${MEERKAT_BAZEL_DISK_CACHE}" ]]; then
          mkdir -p "${MEERKAT_BAZEL_DISK_CACHE}"
        fi

        scripts/buildbuddy-ci-lane-batch

    - name: Upload BuildBuddy logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: buildbuddy-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/buildbuddy-logs
        if-no-files-found: ignore
