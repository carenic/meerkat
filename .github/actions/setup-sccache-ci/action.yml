name: Setup sccache for CI
description: >-
  Install sccache and point it at the GCS object cache through the repository's
  GCP workload identity: the client writes for push and schedule runs and only
  reads for every other run (pull requests from this repository included), a
  setting of the client, not of the identity. When that
  identity is unavailable (pull requests from forks have no id-token, or the
  variables are unset) run with a local disk cache only, with no remote cache,
  instead of failing the lane. When the sccache release cannot be downloaded,
  run without sccache (an empty RUSTC_WRAPPER) instead of failing the lane; a
  download whose sha256 does not match the pin still fails it.

inputs:
  bucket:
    description: GCS bucket for sccache objects (empty disables the GCS backend).
    required: false
    default: ""
  workload_identity_provider:
    description: GCP workload identity provider resource name.
    required: false
    default: ""
  service_account:
    description: GCP service account to impersonate.
    required: false
    default: ""
  project_id:
    description: GCP project of the bucket.
    required: false
    default: ""
  key_prefix:
    description: Object key prefix; keep it per toolchain so a compiler bump starts a fresh namespace.
    required: false
    default: sccache/unpinned

outputs:
  backend:
    description: Selected backend, gcs or local; none when the download failed and the job runs without sccache.
    value: ${{ steps.select.outputs.backend || 'none' }}

runs:
  using: composite
  steps:
    # A pinned sccache release, checked here against its sha256: sccache-action
    # checks a download only against the same release's .sha256 file, and it
    # exports the job's Actions cache token, which neither backend below uses.
    # Renovate proposes a new SCCACHE_VERSION (renovate.json); SCCACHE_SHA256
    # changes with it, or this check fails. The backend is selected below.
    # A download that fails leaves the lane without sccache instead of failing
    # it (the release host answered one lane's nine tries with 403 while the
    # run's other lanes downloaded it): an empty RUSTC_WRAPPER, which Cargo
    # reads as no wrapper, replaces the job's sccache wrapper, and the steps
    # below are skipped. A download that completes is used only once its
    # sha256 matches; a mismatch still fails the lane, so no unverified binary
    # ever reaches PATH or runs.
    - name: Install sccache
      id: install
      shell: bash
      env:
        SCCACHE_VERSION: v0.18.0
        SCCACHE_SHA256: 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}/${RUNNER_ARCH}" != "Linux/X64" ]]; then
          echo "::error::setup-sccache-ci pins sccache for Linux x86_64 only, not ${RUNNER_OS}/${RUNNER_ARCH}" >&2
          exit 1
        fi
        name="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl"
        dir="${RUNNER_TEMP}/sccache-install"
        archive="${dir}/${name}.tar.gz"
        mkdir -p "${dir}/bin"
        status=0
        curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors -o "${archive}" \
          "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${name}.tar.gz" \
          2> "${dir}/curl.err" || status=$?
        cat "${dir}/curl.err" >&2
        if (( status != 0 )); then
          rm -f "${archive}"
          cause="$(tail -n 1 "${dir}/curl.err" | sed 's/^curl: ([0-9]*) //')"
          cause="${cause//%/%25}"
          echo "::warning::sccache ${SCCACHE_VERSION} download failed (curl exit ${status}: ${cause:-no message}); this job compiles without sccache"
          echo "RUSTC_WRAPPER=" >> "${GITHUB_ENV}"
          echo "installed=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        echo "${SCCACHE_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "${archive}" -C "${dir}/bin" --strip-components=1 "${name}/sccache"
        echo "${dir}/bin" >> "${GITHUB_PATH}"
        echo "SCCACHE_PATH=${dir}/bin/sccache" >> "${GITHUB_ENV}"
        "${dir}/bin/sccache" --version
        echo "installed=true" >> "${GITHUB_OUTPUT}"

    - name: Authenticate to GCP with workload identity
      id: gcp
      if: ${{ steps.install.outputs.installed == 'true' && inputs.bucket != '' && inputs.workload_identity_provider != '' && inputs.service_account != '' }}
      # A fork's pull request has no id-token permission; a failed
      # authentication selects the local fallback below, it never fails the
      # lane (and the gate grants no budget exemption for it).
      continue-on-error: true
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        project_id: ${{ inputs.project_id }}
        create_credentials_file: true
        export_environment_variables: false

    - name: Select the sccache backend
      id: select
      if: ${{ steps.install.outputs.installed == 'true' }}
      shell: bash
      env:
        BUCKET: ${{ inputs.bucket }}
        KEY_PREFIX: ${{ inputs.key_prefix }}
        GCP_OUTCOME: ${{ steps.gcp.outcome }}
        CREDENTIALS_FILE: ${{ steps.gcp.outputs.credentials_file_path }}
        # Only a push (main or a release branch) or a schedule has sccache
        # write the bucket, whose objects the push to main compiles from
        # before it attests; every other run, a pull request included, has
        # it only read. The mode binds the client: the credentials file
        # exported below is the same identity's in every run.
        RW_MODE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        set -euo pipefail
        if [[ -n "${BUCKET}" && "${GCP_OUTCOME}" == "success" && -n "${CREDENTIALS_FILE}" && -s "${CREDENTIALS_FILE}" ]]; then
          {
            echo "SCCACHE_GCS_BUCKET=${BUCKET}"
            echo "SCCACHE_GCS_RW_MODE=${RW_MODE}"
            echo "SCCACHE_GCS_KEY_PREFIX=${KEY_PREFIX}"
            echo "SCCACHE_GCS_KEY_PATH=${CREDENTIALS_FILE}"
          } >> "${GITHUB_ENV}"
          echo "backend=gcs" >> "${GITHUB_OUTPUT}"
          echo "sccache backend: gcs://${BUCKET}/${KEY_PREFIX} (${RW_MODE})"
        else
          # No remote cache: a fresh runner's local disk cache, so the lane
          # compiles cold and still counts against the same budget.
          echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache-local" >> "${GITHUB_ENV}"
          echo "backend=local" >> "${GITHUB_OUTPUT}"
          echo "sccache backend: local disk only (GCS identity unavailable: bucket='${BUCKET}', auth outcome='${GCP_OUTCOME}')"
        fi

    - name: Start the sccache server
      if: ${{ steps.install.outputs.installed == 'true' }}
      shell: bash
      env:
        BACKEND: ${{ steps.select.outputs.backend }}
        RW_MODE: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'READ_WRITE' || 'READ_ONLY' }}
      run: |
        set -euo pipefail
        # sccache probes the bucket with one shared object (.sccache_check)
        # at server start; when every lane of a run starts within the same
        # second, GCS's per-object mutation rate limit (429) fails the probe
        # for some of them and that server silently runs ReadOnly for the
        # whole lane. Stagger the start and restart until the server reports
        # ReadWrite (a read-write GCS backend only; a read-only one is meant
        # to come up ReadOnly, and the local fallback has no probe).
        for attempt in 1 2 3 4 5 6; do
          sccache --stop-server >/dev/null 2>&1 || true
          if [[ -n "${SCCACHE_ERROR_LOG:-}" ]]; then : > "${SCCACHE_ERROR_LOG}"; fi
          sleep "$((RANDOM % 10 + attempt))"
          sccache --start-server
          if [[ "${BACKEND}" == "gcs" && "${RW_MODE}" == "READ_WRITE" && -n "${SCCACHE_ERROR_LOG:-}" ]] && grep -q 'server has setup with ReadOnly' "${SCCACHE_ERROR_LOG}"; then
            echo "sccache server came up ReadOnly (bucket write probe rate-limited); restarting (attempt ${attempt})"
            continue
          fi
          break
        done
        sccache --show-stats | grep -E 'Cache location|Compile requests'
        if [[ "${BACKEND}" == "gcs" && -n "${SCCACHE_ERROR_LOG:-}" ]]; then
          grep -E 'server has setup with' "${SCCACHE_ERROR_LOG}" | tail -1
        fi
